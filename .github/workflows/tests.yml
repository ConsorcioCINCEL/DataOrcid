name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dataorcid
          POSTGRES_PASSWORD: dataorcid
          POSTGRES_DB: dataorcid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataorcid -d dataorcid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q app migrations tests
      - name: Validate translation catalogs
        run: pybabel compile -d app/translations
      - name: Validate fresh PostgreSQL migrations
        env:
          FLASK_APP: run.py
          ORCID_APP_CONFIG: config/config.toml.example
          ORCID_DATABASE_URI: postgresql+psycopg://dataorcid:dataorcid@127.0.0.1:5432/dataorcid_test
        run: |
          flask db upgrade
          flask db check
      - name: Run test suite
        run: pytest -q
