<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Actualización en curso · ORCID CINCEL</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #647087;
      --orange: #ff9933;
      --orange-dark: #dc7112;
      --paper: #ffffff;
      --wash: #fff7ed;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, rgba(255, 153, 51, .16), transparent 31rem),
        linear-gradient(135deg, #f7f9fc 0%, var(--wash) 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(680px, 100%);
      padding: clamp(34px, 7vw, 64px);
      border: 1px solid rgba(23, 32, 51, .08);
      border-radius: 28px;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 28px 80px rgba(23, 32, 51, .12);
    }

    .brand {
      width: min(270px, 72%);
      height: auto;
      margin-bottom: 38px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 16px;
      color: var(--orange-dark);
      font-size: .78rem;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--orange);
      box-shadow: 0 0 0 6px rgba(255, 153, 51, .15);
      content: "";
    }

    h1 {
      max-width: 12ch;
      margin: 0;
      font-size: clamp(2.2rem, 7vw, 4.25rem);
      line-height: .98;
      letter-spacing: -.055em;
    }

    p {
      max-width: 52ch;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.16rem);
      line-height: 1.65;
    }

    .rule {
      width: 74px;
      height: 5px;
      margin-top: 34px;
      border-radius: 99px;
      background: var(--orange);
    }
  </style>
</head>
<body>
  <main>
    <img class="brand" src="/static/cincel.svg" alt="CINCEL">
    <div class="eyebrow">Actualización programada</div>
    <h1>Volvemos en unos minutos.</h1>
    <p>
      Estamos sincronizando ORCID y OpenAlex y renovando la plataforma para
      ofrecer información más completa y actualizada. Gracias por tu paciencia.
    </p>
    <div class="rule" aria-hidden="true"></div>
  </main>
</body>
</html>
